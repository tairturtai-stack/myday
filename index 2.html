<style>
:root{color-scheme:dark;--bg:#0b0b0d;--card:#17171a;--card2:#202024;--line:#2a2a2f;--tx:#f2f2f4;--mut:#8b8b94;--acc:#7c8cff;--ok:#4cd69b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Text",system-ui,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:20px 18px 110px}
h1{font-size:26px;margin:0 0 2px;font-weight:700}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px}.row>*{flex:1}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.big{font-size:22px;font-weight:700}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .4s}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;padding:0;color:#000;font-size:14px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done span{color:var(--mut);text-decoration:line-through}
.task span{flex:1;font-size:16px}
.del{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.add{display:flex;gap:8px;margin-top:10px}
input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);font-size:16px;padding:12px;outline:none;min-width:0}
input:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#0b0b0d;border:0;border-radius:12px;font-weight:700;font-size:15px;padding:0 16px}
.empty{color:var(--mut);font-size:14px;padding:8px 0}
.stat{cursor:pointer;text-align:left;color:var(--tx);font:inherit;width:100%}
.ph{text-align:center;padding:60px 20px;color:var(--mut)}
.ph .ic{font-size:44px;margin-bottom:10px}
.ph b{color:var(--tx);display:block;font-size:20px;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,15,17,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:4px 8px;flex:1}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ai{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#0b0b0d;border:0;border-radius:28px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(124,140,255,.35)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet div{background:var(--card);border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:0 auto}
.sheet h3{margin:0 0 8px}.sheet p{color:var(--mut);margin:0 0 16px;line-height:1.45}
.sheet .btn{width:100%;padding:14px}
select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:12px;outline:none;width:100%}
textarea{min-height:110px;resize:vertical}
.back{background:none;border:0;color:var(--acc);font-size:16px;padding:0 0 12px}
.pc{display:block;width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.pc b{font-size:17px}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.fld{display:flex;flex-direction:column;gap:10px}
.log{color:var(--mut);font-size:13px;padding:5px 0}
.btn.red{background:#3a1d20;color:#ff8a8a;width:100%;padding:14px;margin-top:4px}
.chips{display:flex;gap:8px}.chip{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:10px;font-size:14px}.chip.on{color:var(--tx);border-color:var(--acc)}
.bad{border-color:#ff6b6b!important}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}.cd{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:14px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.cd.sel{border-color:var(--acc)}.cd.td{color:var(--acc);font-weight:700}.dts{display:flex;gap:2px;height:5px;margin-top:3px}.dts i{width:5px;height:5px;border-radius:50%}.wd{color:var(--mut);font-size:12px;text-align:center}
.lk{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--tx);font:inherit;text-align:left;padding:11px 0}.lk:first-of-type{border-top:0}.lk span:nth-child(2),.lk>span:first-child:not(.dot){flex:1}.lk small{color:var(--mut)}
.hds{display:flex;gap:4px;margin-top:10px}.hd{flex:1;height:26px;border-radius:7px;border:1px solid var(--line);background:none;padding:0}.hd.on{background:var(--ok);border-color:var(--ok)}.hd.off{opacity:.35}.hd.tdy{outline:1px solid var(--acc)}
.ch{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:6px}.ch i{flex:1;background:var(--acc);border-radius:3px 3px 0 0}
.fab{position:fixed;left:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:26px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-size:28px;line-height:1;padding:0;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.qs{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}.qs.show{display:flex}.qs>.qb{background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:0 auto;max-height:88%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:20;font-size:14px;max-width:90%}
</style>
</head>
<body>

<script>
var TABS=[

["study","Учёба","<path d='M2 9l10-5 10 5-10 5z'/><path d='M6 11v5c3 2.5 9 2.5 12 0v-5'/>"],

var INFO={
study:null,

proj:null};
var mem={tasks:[],projects:[],pid:null,form:false,conf:false,fin:{tx:[],goals:[]},fper:'m',fform:false,ftype:'e',st:{sch:[],hw:[],notes:[],cards:[]},stab:'sch',nid:null,cqi:0,flip:false,sday:(new Date().getDay()+6)%7,sp:{progs:[],logs:[],wk:null},sptab:'prog',spid:null,ai:{msgs:[],perm:{t:1,s:1,f:1,w:1,p:1},busy:false},hb:{list:[]},xp:0,hform:false,hname:'',hdays:[0,1,2,3,4,5,6],hconf:0,hmsg:'',wl:[],ftab:'ov',fedit:0,wform:false,wconf:'',x:{goals:[],flog:[],fo:{st:'idle',mins:25,label:'',endAt:0,left:0}},gform:false,gopen:0,gconf:'',qc:{open:false,text:'',type:'',msg:''}},tab="home";
function load(){try{localStorage.setItem("myday_t","1");localStorage.removeItem("myday_t")}catch(e){mem.nostore=true}try{var s=localStorage.getItem("myday_tasks");if(s)mem.tasks=JSON.parse(s);var q=localStorage.getItem("myday_projects");if(q)mem.projects=JSON.parse(q);var f=localStorage.getItem("myday_fin");if(f)mem.fin=JSON.parse(f);var z=localStorage.getItem("myday_study");if(z)mem.st=JSON.parse(z);var y=localStorage.getItem("myday_sport");if(y)mem.sp=JSON.parse(y);var k=localStorage.getItem("myday_ai");if(k){var q2=JSON.parse(k);mem.ai.msgs=arr(q2.msgs).filter(function(x){return x&&typeof x.t==='string'&&x.t}).map(function(x){return{r:x.r==='u'?'u':'a',t:S(x.t,6000),tasks:arr(x.tasks).map(function(s){return S(s,120)}).filter(Boolean).slice(0,5),added:!!x.added}});mem.ai.perm=q2.perm||mem.ai.perm}mem.name=localStorage.getItem("myday_name")||"";var c=cleanData({tasks:mem.tasks,projects:mem.projects,fin:mem.fin,st:mem.st,sp:mem.sp,name:mem.name,hb:(function(){try{return JSON.parse(localStorage.getItem("myday_hb")||"null")}catch(e){return null}})(),wl:(function(){try{return JSON.parse(localStorage.getItem("myday_wl")||"null")}catch(e){return null}})(),x:(function(){try{return JSON.parse(localStorage.getItem("myday_x")||"null")}catch(e){return null}})()});mem.tasks=c.tasks;mem.projects=c.projects;mem.fin=c.fin;mem.st=c.st;mem.sp=c.sp;mem.name=c.name;mem.hb={list:c.hb.list};mem.xp=c.hb.xp;mem.wl=c.wl;mem.x=c.x;mem.tasks=mem.tasks.filter(function(x){return !(x.done&&x.d&&x.d<iso(new Date()))})}catch(e){}}
function save(){try{localStorage.setItem("myday_tasks",JSON.stringify(mem.tasks));localStorage.setItem("myday_projects",JSON.stringify(mem.projects));localStorage.setItem("myday_fin",JSON.stringify(mem.fin));localStorage.setItem("myday_study",JSON.stringify(mem.st));localStorage.setItem("myday_sport",JSON.stringify(mem.sp));localStorage.setItem("myday_ai",JSON.stringify({msgs:mem.ai.msgs.slice(-30),perm:mem.ai.perm}));localStorage.setItem("myday_name",mem.name||"");localStorage.setItem("myday_hb",JSON.stringify({list:mem.hb.list,xp:mem.xp}));localStorage.setItem("myday_wl",JSON.stringify(mem.wl));localStorage.setItem("myday_x",JSON.stringify(mem.x))}catch(e){mem.nostore=true}}
function esc(t){return t.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function greet(){var h=new Date().getHours();return h<6?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер"}
function nav(){
document.getElementById("nav").innerHTML=TABS.map(function(t){
return "<button class='"+(t[0]===tab?"on":"")+"' data-t='"+t[0]+"'><svg viewBox='0 0 24 24'>"+t[2]+"</svg>"+t[1]+"</button>"}).join("");
document.getElementById("aiBtn").style.display=tab==="home"?"block":"none"}
function render(){focCheck();
nav();var m=document.getElementById("main");
if(tab==="proj"){renderProj(m);return}if(tab==="money"){renderMoney(m);return}if(tab==="study"){renderStudy(m);return}if(tab==="sport"){renderSport(m);return}if(tab==="cal"){renderCal(m);return}if(tab==="ai"){renderAI(m);return}if(tab==="set"){renderSet(m);return}if(tab==="hab"){renderHab(m);return}if(tab==="goals"){renderGoals(m);return}if(tab==="focus"){renderFocus(m);return}if(tab!=="home"){var i=INFO[tab];
m.innerHTML="<div class='ph'><div class='ic'>"+i[0]+"</div><b>"+i[1]+"</b>"+i[2]+"</div>";return}
var od=mem.tasks.filter(function(x){return !x.done&&x.d&&x.d<iso(new Date())}),d=mem.tasks.filter(function(x){return od.indexOf(x)<0&&!(x.d&&x.d>iso(new Date()))}),n=d.filter(function(x){return x.done}).length,p=d.length?Math.round(n/d.length*100):0;

m.innerHTML=(mem.nostore?"<div class='card' style='color:#ffc857'>⚠ Сохранение недоступно: открой страницу в Safari, иначе данные пропадут при закрытии.</div>":"")+"<h1>"+greet()+(mem.name?", "+esc(mem.name):"")+"</h1><div class='sub'>"+ds+"</div>"
+"<div class='card'><div class='lbl'>Прогресс дня</div><div class='big'>"+n+" из "+d.length+" задач</div><div class='bar'><i style='width:"+p+"%'></i></div>"+levelLine()+"</div>"
+overdueCard(od)+"<div class='card'><div class='lbl'>Задачи на сегодня</div>"+list
+"<div class='add'><input id='ti' placeholder='Новая задача' maxlength='120'><button class='btn' id='ta'>Добавить</button></div></div>"
+homeCards()+"<button class='card stat' data-t='cal'><div class='big'>📅 Календарь</div><div class='lbl' style='margin:6px 0 0'>Занятия, дедлайны и тренировки</div></button>"+"<div class='row'>"+st("money","Расходы за месяц",fmt(sum('e','m')))+st("sport","Тренировок за неделю",wkCount())+"</div>"

function addTask(){var i=document.getElementById("ti");var v=i.value.trim();if(!v)return;mem.tasks.push({t:v,done:false,d:iso(new Date())});save();render()}
document.addEventListener("click",function(e){

if(b.dataset.go){goTo(b.dataset.go);render();document.getElementById("main").scrollTop=0}else if(b.dataset.t){tab=b.dataset.t;mem.conf=false;mem.form=false;mem.fform=false;mem.rconf=false;mem.xconf=false;mem.fedit=0;mem.wconf='';mem.wform=false;mem.gform=false;mem.gconf='';mem.msg='';mem.bk='';render();document.getElementById("main").scrollTop=0}
